<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hitarea Crop Copier</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Hitarea Crop Copier</h1>

    <label for="host">Preview host</label>
    <input id="host" type="text" placeholder="stargate-nebula.netlify.app" autocomplete="off" spellcheck="false" />
    <p class="hint">The domain that renders the template preview iframe — differs per brand
      (e.g. <code>toyota-au.sesimi.app</code>, <code>volkswagen-us.sesimi.app</code>). Chrome will
      ask for one-time permission the first time you use a new host.</p>

    <label for="hitarea">data-hitarea value</label>
    <input id="hitarea" type="text" placeholder="tabHero" autocomplete="off" spellcheck="false" />

    <button id="extract" type="button">Copy crop params</button>

    <p id="status" class="status" role="status"></p>

    <div id="result" class="result" hidden>
      <code id="result-text"></code>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
